name: Validate app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: pip install opencv-python-headless==4.14.0.94 numpy==2.4.6 pyyaml
      - run: python sface_yunet/download_models.py sface_yunet/models
      - run: python tests/smoke.py
      - run: docker build --tag sface-yunet:test sface_yunet
